<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>booger</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1 style="text-align:center;">book logger</h1>

    <button id="clear" onclick="clearStorage()">clear local storage</button>

    <img src="book pixel online.jpg" alt="book img" usemap="#bookmap" id="bookimg">
    <map name="bookmap">
    <area shape="poly" coords="31,89, 131,38, 187,93, 187,129, 89,178, 32,129," href="#" onclick="openPopup()">
    </map>

    <div id="saveContainer">
        <p>save container div here </p>
    </div>
    

    <script src="script.js"></script>

    <div id="popup">
        <!-- <p class="popup-text">class popup text</p> -->
        <button id="closePopup" onclick="closePopup()">X</button>
        <form method="post">
            <input type="text" id="titleForm" class="formInput" name="test" placeholder="title here"> <br>
            <input type="text" id="summaryForm" class="formInput" name="test" placeholder="summary">
            <input type="text" id="analysisForm" class="formInput" name="test" placeholder="analysis">
            <input type="text" id="quotesForm" class="formInput" name="test" placeholder="quotes">
            <input type="text" id="commentsForm" class="formInput" name="test" placeholder="comments">

            <button type="button" id="log" onclick="logData(event)">LOG</button>

            <!-- radio demon?!?!

            <input type="radio" id="radio" name="radio">
            <label for="radio">radio:</label> <br>
            <input type="radio" id="radio2" name="radio">
            <label for="radio2">radio2</label> <br>
            
            -->
        </form>
    </div>
    

</body>
</html>
