<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>booger</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!--

        <li>item</li>

    <div id="titleBar">
        <h1 style="text-align:center; margin-right: auto;">book logger</h1>
        <p id="tablet">lol idiot on a  tablet</p>
        <button id="clear" onclick="clearStorage()">clear local storage</button>

    </div>

    <img src="logbook.png" alt="book img" usemap="#bookmap" id="bookimg">
    <map name="bookmap">
    <area shape="poly" coords="8,46, 37,37, 70,37, 91,46, 125,46, 145,35, 179,36, 206,46, 206,177, 9,178" href="#" onclick="openPopup()">
    </map>

    <div id="body">

        <div id="bookshelf">

            <div class="shelf" id="saveContainer"></div>
            <div class="shelf" id="1"></div>
            <div class="shelf" id="2"></div>
        </div>



    </div>

    
    

    <div id="popup">
        <!-- <p class="popup-text">class popup text</p> -->
        <button id="closePopup" onclick="closePopup()">X</button>
        <form method="post" id="foorm">
            <textarea id="title" class="formInput" placeholder="title here"></textarea>
            <div id="popupBody">
                <textarea id="quotes" class="formInput" placeholder="quotes here"></textarea>
                <textarea id="summary" class="formInput" placeholder="summary here"></textarea>
                <div id="statsDiv" class="formInput"></div>
                <textarea id="analysis" class="formInput" placeholder="analysis here"></textarea>
                <textarea id="comments" class="formInput" placeholder="comments here"></textarea>
            </div>
            
 

            <button type="button" id="log" onclick="logData(event)">LOG</button>

            <!-- radio demon?!?!

            <input type="radio" id="radio" name="radio">
            <label for="radio">radio:</label> <br>
            <input type="radio" id="radio2" name="radio">
            <label for="radio2">radio2</label> <br>
            
            -->
        </form>
    </div>

    <div id="loadLog">
        <button id="closeLoad" onclick="closeLoad()">X</button>
        <h1 id="titleLoad" >loadTitle</h1>
        <p id="summaryLoad">loadSummary</p>
        <p id="analysisLoad">loadAnalysis</p>
        <p id="quotesLoad">loadQuotes</p>
        <p id="commentsLoad">loadComments</p>
    </div>

    <script src="script.js"></script>

    

</body>
</html>
