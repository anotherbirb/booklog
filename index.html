<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>booger</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1 style="text-align:center;">book logger</h1>

    <button id="clear" onclick="clearStorage()">clear local storage</button>

    <img src="book pixel online.jpg" alt="book img" usemap="#bookmap" id="bookimg">
    <map name="bookmap">
    <area shape="poly" coords="31,89, 131,38, 187,93, 187,129, 89,178, 32,129," href="#" onclick="openPopup()">
    </map>

    <div id="saveContainer">
        <p>save container div here </p>
    </div>
    

    <script src="script.js"></script>

    <div id="popup">
        <!-- <p class="popup-text">class popup text</p> -->
        <button id="closePopup" onclick="closePopup()">X</button>
        <form method="post" id="foorm">
            <textarea id="title" class="formInput" placeholder="title here"></textarea>
            <div id="body">
                <textarea id="quotes" class="formInput" placeholder="quotes here"></textarea>
                <textarea id="summary" class="formInput" placeholder="summary here"></textarea>
                <div id="break"></div>
                <textarea id="comments" class="formInput" placeholder="comments here"></textarea>
                <textarea id="analysis" class="formInput" placeholder="analysis here"></textarea>
            </div>
            
 

            <button type="button" id="log" onclick="logData(event)">LOG</button>

            <!-- radio demon?!?!

            <input type="radio" id="radio" name="radio">
            <label for="radio">radio:</label> <br>
            <input type="radio" id="radio2" name="radio">
            <label for="radio2">radio2</label> <br>
            
            -->
        </form>
    </div>
    

</body>
</html>
